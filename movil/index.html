<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<!-- Esto es lo único que iOS mira al añadir a la pantalla de inicio. Por eso
     existe esta página: el icono y el nombre los decide el documento que se
     añade, y en streamlit.app ese documento es de Streamlit, no nuestro. -->
<title>LF Global Capital</title>
<link rel="apple-touch-icon" href="icono.png">
<link rel="icon" href="icono.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LF Capital">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0F15">

<style>
  :root { --fondo: #0B0F15; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: var(--fondo);
    overscroll-behavior: none;
  }
  /* El iframe no hereda las zonas seguras del iPhone: dentro de él
     `env(safe-area-inset-*)` vale 0. Así que las reserva esta página, y la
     barra inferior de la app queda por encima del indicador de inicio. */
  #marco {
    position: fixed; inset: 0; background: var(--fondo);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
    box-sizing: border-box;
  }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--fondo); }
  /* Mientras carga, el nombre en vez de una pantalla en blanco. */
  #cargando {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: var(--fondo); color: #E2B35A; z-index: 2;
    font-family: Georgia, 'Times New Roman', serif; font-size: 20px;
    letter-spacing: -.01em; transition: opacity .4s ease;
  }
  #cargando.fuera { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div id="cargando">LF <em>Global Capital</em></div>

<div id="marco">
  <!-- `embed=true` quita el botón Fork y la insignia de Streamlit Cloud.
       `compacto=1` avisa a la app de que no hace falta reservar hueco para
       esa insignia en la barra inferior (lo lee app.py). -->
  <iframe
    id="app"
    src="https://cultura-general-pepfhixiv8vrnc4ypfmdeq.streamlit.app/?embed=true&compacto=1"
    title="LF Global Capital"
    allow="clipboard-write"></iframe>
</div>

<script>
  var marco = document.getElementById('cargando');
  document.getElementById('app').addEventListener('load', function () {
    marco.classList.add('fuera');
    setTimeout(function () { marco.remove(); }, 500);
  });
  // Red de seguridad: si el evento load no llega, no dejar el velo puesto.
  setTimeout(function () {
    marco.classList.add('fuera');
    setTimeout(function () { if (marco.parentNode) marco.remove(); }, 500);
  }, 12000);
</script>

</body>
</html>
